name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.8"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - name: platform tests
        run: uv run pytest -q tests/infra erp/tests
      # Контрактные тесты краснеют, пока модули из раздела 4 технического задания не написаны.
      - name: contract tests
        run: uv run pytest -q tests/contract
